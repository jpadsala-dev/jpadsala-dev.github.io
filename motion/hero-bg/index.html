<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Canvas","default":"#9fe870"},
    {"id":"deep","type":"color","label":"Darker lime","default":"#80e142"},
    {"id":"soft","type":"color","label":"Lighter lime","default":"#b8f08f"},
    {"id":"forest","type":"color","label":"Forest accent","default":"#163300"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Portfolio hero tokens: --surface-hero, --lime-hover, a lighter lime, --surface-forest */
      :root {
        --ground: #9fe870;
        --deep: #80e142;
        --soft: #b8f08f;
        --forest: #163300;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }

      /* Faint dot grid, fading out toward the headline on the left. Drifts exactly one cell per loop. */
      #grid-mask {
        position: absolute; inset: 0;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 30%, #000 70%);
                mask-image: linear-gradient(90deg, transparent 0%, transparent 30%, #000 70%);
      }
      #grid {
        position: absolute; left: -96px; top: -96px; width: 2112px; height: 1272px;
        background-image: radial-gradient(circle, rgba(22, 51, 0, 0.16) 2.2px, transparent 2.6px);
        background-size: 48px 48px;
      }

      .shape { position: absolute; border-radius: 9999px; }
      #pill-a { width: 760px; height: 300px; left: 1240px; top: -90px; background: var(--soft); }
      #circle-a { width: 520px; height: 520px; left: 1500px; top: 640px; background: var(--deep); }
      #pill-b { width: 620px; height: 220px; left: 300px; top: 930px; background: var(--deep); }
      #circle-b { width: 260px; height: 260px; left: 1100px; top: 720px; background: var(--soft); }
      #pill-c { width: 340px; height: 120px; left: -120px; top: -40px; background: var(--soft); }

      /* Small "UI chips" that bob on the right */
      .chip {
        position: absolute; height: 56px; border-radius: 9999px;
        background: rgba(255, 255, 255, 0.28);
        box-shadow: inset 0 0 0 1.5px rgba(22, 51, 0, 0.10);
      }
      .chip::after {
        content: ""; position: absolute; left: 24px; top: 24px; height: 8px; border-radius: 9999px;
        width: calc(100% - 64px); background: rgba(22, 51, 0, 0.14);
      }
      #chip-1 { width: 220px; left: 1580px; top: 300px; }
      #chip-2 { width: 160px; left: 1180px; top: 520px; }
      #chip-3 { width: 260px; left: 1450px; top: 470px; }

      /* Phone-screen outline that draws in and fades out */
      #phone { position: absolute; left: 1290px; top: 150px; width: 400px; height: 780px; overflow: visible; }
      #phone rect, #phone line { fill: none; stroke: var(--forest); stroke-width: 3; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
      data-layout-allow-overflow
    >
      <div id="grid-mask" data-layout-ignore><div id="grid"></div></div>

      <div id="pill-c" class="shape" data-layout-ignore></div>
      <div id="pill-b" class="shape" data-layout-ignore></div>
      <div id="pill-a" class="shape" data-layout-ignore></div>
      <div id="circle-b" class="shape" data-layout-ignore></div>
      <div id="circle-a" class="shape" data-layout-ignore></div>

      <svg id="phone" viewBox="0 0 400 780" data-layout-ignore>
        <rect id="phone-body" x="4" y="4" width="392" height="772" rx="56" ry="56" />
        <line id="phone-notch" x1="160" y1="40" x2="240" y2="40" />
      </svg>

      <div id="chip-1" class="chip" data-layout-ignore></div>
      <div id="chip-2" class="chip" data-layout-ignore></div>
      <div id="chip-3" class="chip" data-layout-ignore></div>
    </div>

    <script>
      // Loop length. Every tween returns to its frame-0 state at exactly LOOP seconds,
      // so frame 0 follows the last frame with no jump.
      const LOOP = 12;
      const tl = gsap.timeline({ paused: true });

      // Grid: drift exactly one 48px cell diagonally, linear, so the pattern tiles seamlessly.
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: 48, y: 48, duration: LOOP, ease: "none" }, 0);

      // Shape drift: out and back (yoyo). LOOP / half must be EVEN so each shape ends where it started.
      const drift = (sel, from, to, half) => {
        tl.fromTo(sel, from, { ...to, duration: half, ease: "sine.inOut", yoyo: true, repeat: LOOP / half - 1 }, 0);
      };
      drift("#pill-a",   { x: 0, y: 0, rotation: -8, scale: 1 },    { x: -70, y: 40, rotation: -2, scale: 1.05 }, 6);
      drift("#circle-a", { x: 0, y: 0, scale: 1 },                  { x: -60, y: -50, scale: 1.08 },              6);
      drift("#pill-b",   { x: 0, y: 0, rotation: 6 },               { x: 90, y: -20, rotation: 2 },               6);
      drift("#circle-b", { x: 0, y: 0, scale: 0.9 },                { x: 40, y: -60, scale: 1.05 },               3);
      drift("#pill-c",   { x: 0, y: 0, rotation: -12 },             { x: 40, y: 20, rotation: -6 },               6);

      // Chips bob gently, offset from each other.
      drift("#chip-1", { y: 0, opacity: 0.9 },  { y: -18, opacity: 1 },   3);
      drift("#chip-2", { y: -10, opacity: 0.7 }, { y: 10, opacity: 0.95 }, 6);
      drift("#chip-3", { y: 8, opacity: 1 },    { y: -12, opacity: 0.8 },  3);

      // Phone outline: draws in, holds, fades out, then resets invisibly before the loop wraps.
      const perim = 2 * (392 + 772) - (8 - 2 * Math.PI) * 56;
      tl.fromTo("#phone-body", { strokeDasharray: perim, strokeDashoffset: perim },
        { strokeDashoffset: 0, duration: 4, ease: "power2.inOut" }, 0.5);
      tl.fromTo("#phone-notch", { strokeDasharray: 80, strokeDashoffset: 80 },
        { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 3.6);
      tl.fromTo("#phone", { opacity: 0.18 }, { opacity: 0, duration: 2.5, ease: "sine.inOut" }, 8.5);
      tl.set("#phone-body", { strokeDashoffset: perim }, 11.2);
      tl.set("#phone-notch", { strokeDashoffset: 80 }, 11.2);
      tl.set("#phone", { opacity: 0.18 }, 11.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
